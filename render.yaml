services:
  - type: web
    name: amour-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn amour_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: AWS_REGION
        value: "us-west-2"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: JEV_MODEL
        value: "jev-latest"
      - key: JEV_TIMEOUT_SECONDS
        value: "1.5"
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        value: "reeve-devpilot-downloads-309490998255"
      - key: NEON_AUTH_BASE_URL
        value: "https://ep-quiet-bonus-a11t1nym.neonauth.ap-southeast-1.aws.neon.tech/neondb/auth"
      - key: NEON_AUTH_JWKS_URL
        value: "https://ep-quiet-bonus-a11t1nym.neonauth.ap-southeast-1.aws.neon.tech/neondb/auth/.well-known/jwks.json"
