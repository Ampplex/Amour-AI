services:
  - type: web
    name: amour-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn amour_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: AWS_REGION
        value: "us-west-2"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        value: "reeve-devpilot-downloads-309490998255"
      - key: LLM_PROVIDER
        value: "bedrock"
      - key: RESPONSE_LLM_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_FALLBACK
        sync: false
      - key: BEDROCK_SMALL_MODEL_ID
        value: "meta.llama3-1-8b-instruct-v1:0"
      - key: LLM_MODEL
        value: "qwen/qwen3.8-27b"
      - key: GROQ_CHAT_MODEL
        value: "qwen/qwen3.8-27b"
      - key: NEON_AUTH_BASE_URL
        value: "https://ep-quiet-bonus-a11t1nym.neonauth.ap-southeast-1.aws.neon.tech/neondb/auth"
      - key: NEON_AUTH_JWKS_URL
        value: "https://ep-quiet-bonus-a11t1nym.neonauth.ap-southeast-1.aws.neon.tech/neondb/auth/.well-known/jwks.json"
